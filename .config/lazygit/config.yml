# lazygit — ayu dark (matches Neovim's ayu-dark)
gui:
  theme:
    activeBorderColor:
      - "#E6B450"
      - bold
    inactiveBorderColor:
      - "#454B55"
    searchingActiveBorderColor:
      - "#39BAE6"
    optionsTextColor:
      - "#59C2FF"
    selectedLineBgColor:
      - "#1B3A5B"
    inactiveViewSelectedLineBgColor:
      - "#122132"
    cherryPickedCommitFgColor:
      - "#D2A6FF"
    cherryPickedCommitBgColor:
      - "#1B3A5B"
    markedBaseCommitFgColor:
      - "#59C2FF"
    markedBaseCommitBgColor:
      - "#E6B450"
    unstagedChangesColor:
      - "#F26D78"
    defaultFgColor:
      - "#BFBDB6"
  authorColors:
    "*": "#39BAE6"
git:
  # Render diffs with delta, same as `git diff`.
  diffRenderers:
    - command: delta --paging=never
