# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# scrollback, gap-free window numbers, and copy-mode yanks to the system
# clipboard via OSC 52 (works over SSH too)
set -g history-limit 50000
set -g renumber-windows on
set -g set-clipboard on

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Seamless pane switching between tmux and (n)vim splits with C-hjkl
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ...and while in copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# enable vi mode keys
set-window-option -g mode-keys vi

# tmux's own terminfo (italics, undercurl, correct key sequences), plus
# truecolor for the outer terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# allow focus events to get through to applications running in tmux
set -g focus-events on


# Design Tweaks
# -------------

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes (ayu dark)
setw -g clock-mode-colour '#E6B450'
setw -g mode-style 'fg=#0B0E14 bg=#E6B450 bold'

# panes
set -g pane-border-style 'fg=#454B55'
set -g pane-active-border-style 'fg=#E6B450'

# statusbar (ayu dark)
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#BFBDB6 bg=#0F131A'

set -g status-left '#{?client_prefix,#[fg=#0B0E14 bg=#FF8F40],#[fg=#0B0E14 bg=#E6B450]} #S '
set -g status-left-length 20

set -g status-right-style 'fg=#0B0E14 bg=#59C2FF'
set -g status-right '#[fg=#0B0E14 bg=#59C2FF] %Y-%m-%d %H:%M '

setw -g window-status-current-style 'fg=#0B0E14 bg=#59C2FF bold'
setw -g window-status-current-format ' #I #W#F '

setw -g window-status-style 'fg=#BFBDB6 bg=#0F131A'
setw -g window-status-separator ''
setw -g window-status-format ' #I #W#F '

setw -g window-status-bell-style 'fg=#0B0E14 bg=#F26D78 bold'

# messages
set -g message-style 'fg=#0B0E14 bg=#E6B450 bold'
