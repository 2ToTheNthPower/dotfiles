# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Seamless pane switching between tmux and (n)vim splits with C-hjkl
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ...and while in copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# enable vi mode keys
set-window-option -g mode-keys vi

# set default terminal mode to 256 colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# allow focus events to get through to applications running in tmux
set -g focus-events on


# Design Tweaks
# -------------

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour '#cba6f7'
setw -g mode-style 'fg=#1e1e2e bg=#f5c2e7 bold'

# panes
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#cba6f7'

# statusbar (Catppuccin Mocha)
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#cdd6f4 bg=#181825'

set -g status-left '#{?client_prefix,#[fg=#1e1e2e bg=#f9e2af],#[fg=#1e1e2e bg=#cba6f7]} #S '
set -g status-left-length 20

set -g status-right-style 'fg=#1e1e2e bg=#89b4fa'
set -g status-right '#[fg=#1e1e2e bg=#89b4fa] %Y-%m-%d %H:%M '

setw -g window-status-current-style 'fg=#1e1e2e bg=#89b4fa bold'
setw -g window-status-current-format ' #I #W#F '

setw -g window-status-style 'fg=#a6adc8 bg=#181825'
setw -g window-status-separator ''
setw -g window-status-format ' #I #W#F '

setw -g window-status-bell-style 'fg=#1e1e2e bg=#f38ba8 bold'

# messages
set -g message-style 'fg=#1e1e2e bg=#f9e2af bold'
